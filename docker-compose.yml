services:
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_FILE: /app/data/readings.jsonl
      DEVICE_API_KEY: ${DEVICE_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      FIREBASE_AUTH_TOKEN: ${FIREBASE_AUTH_TOKEN:-}
      BLYNK_SERVER: ${BLYNK_SERVER:-https://blynk.cloud}
      BLYNK_AUTH_TOKEN: ${BLYNK_AUTH_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - fieldline-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  simulator:
    build: .
    command: ["node", "simulator/sensor-simulator.mjs", "--continuous"]
    environment:
      API_URL: http://app:8080
      DEVICE_API_KEY: ${DEVICE_API_KEY:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  fieldline-data:
